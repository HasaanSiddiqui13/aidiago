<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Patients - Healthcare AI</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: white;
            padding: 30px;
            margin: 50px auto;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #007bff;
        }

        .search-bar {
            width: 80%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 5px;
            border: 1px solid #ccc;
            text-align: center;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #007bff;
            color: white;
        }

        .view-button {
            background: #007bff;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .view-button:hover {
            background: #0056b3;
        }

        .footer {
            margin-top: 20px;
            background: #222;
            color: white;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>View Patients</h1>
        <input type="text" id="search" class="search-bar" placeholder="🔍 Search for a patient..." onkeyup="filterPatients()">
        <table id="patientTable">
            <thead>
                <tr>
                    <th>Patient ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Condition</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>#1023</td>
                    <td>Ali Raza</td>
                    <td>45</td>
                    <td>Hypothyroidism</td>
                    <td><button class="view-button" onclick="viewPatient('Ali Raza')">🔍 View</button></td>
                </tr>
                <tr>
                    <td>#1087</td>
                    <td>Sara Ahmed</td>
                    <td>38</td>
                    <td>Hyperthyroidism</td>
                    <td><button class="view-button" onclick="viewPatient('Sara Ahmed')">🔍 View</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        <p>© 2024 Healthcare AI | All rights reserved</p>
    </div>

    <script>
        function filterPatients() {
            let input = document.getElementById("search").value.toLowerCase();
            let rows = document.querySelectorAll("#patientTable tbody tr");
            rows.forEach(row => {
                let text = row.textContent.toLowerCase();
                row.style.display = text.includes(input) ? "" : "none";
            });
        }

        function viewPatient(name) {
            alert("Viewing details for: " + name);
        }
    </script>
</body>
</html>
