<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Diagnosis Reports - Healthcare AI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.4/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: white;
            padding: 30px;
            margin: 50px auto;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #007bff;
        }

        .filter-section {
            margin: 20px 0;
        }

        input {
            width: 80%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 5px;
            border: 1px solid #ccc;
            text-align: center;
        }

        .button {
            background: #007bff;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .button:hover {
            background: #0056b3;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #007bff;
            color: white;
        }

        .footer {
            margin-top: 20px;
            background: #222;
            color: white;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Diagnosis Reports</h1>
        <div class="filter-section">
            <input type="text" id="search" placeholder="🔍 Search Reports" onkeyup="filterReports()">
            <button class="button" onclick="exportToExcel()">📊 Export to Excel</button>
        </div>
        <table id="reportTable">
            <thead>
                <tr>
                    <th>Patient Name</th>
                    <th>Date</th>
                    <th>Diagnosis</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Ali Raza</td>
                    <td>2025-03-07</td>
                    <td>Hypothyroidism</td>
                    <td>
                        <button class="button" onclick="viewReport('Ali Raza', 'Hypothyroidism')">👁 View</button>
                        <button class="button" onclick="downloadPDF('Ali Raza', 'Hypothyroidism')">📄 Download</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        <p>© 2024 Healthcare AI | All rights reserved</p>
    </div>

    <script>
        function filterReports() {
            let input = document.getElementById("search").value.toLowerCase();
            let rows = document.querySelectorAll("#reportTable tbody tr");
            rows.forEach(row => {
                let text = row.textContent.toLowerCase();
                row.style.display = text.includes(input) ? "" : "none";
            });
        }

        function viewReport(patientName, diagnosis) {
            alert(`Patient Name: ${patientName}\nDiagnosis: ${diagnosis}\nDate: ${new Date().toISOString().split('T')[0]}`);
        }

        function downloadPDF(patientName, diagnosis) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text(`Patient Name: ${patientName}\nDiagnosis: ${diagnosis}\nDate: ${new Date().toISOString().split('T')[0]}`, 10, 10);
            doc.save(`${patientName}_Diagnosis_Report.pdf`);
        }

        function exportToExcel() {
            let table = document.getElementById("reportTable");
            let wb = XLSX.utils.table_to_book(table, { sheet: "Reports" });
            XLSX.writeFile(wb, "Diagnosis_Reports.xlsx");
        }
    </script>
</body>
</html>
