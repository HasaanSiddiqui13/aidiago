<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - Healthcare AI</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            height: 100vh;
            background: #007bff;
            padding: 20px;
            color: white;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            margin: 20px 0;
        }

        .sidebar ul li a {
            text-decoration: none;
            color: white;
            display: block;
            padding: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            text-align: center;
        }

        .sidebar ul li a:hover {
            background: white;
            color: #007bff;
        }

        /* Dashboard Content */
        .dashboard-container {
            flex: 1;
            padding: 30px;
            background: white;
            margin: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #007bff;
            text-align: center;
        }

        .chart-container {
            width: 80%;
            margin: auto;
            padding: 20px;
            background: #e9f5ff;
            border-radius: 10px;
            text-align: center;
        }

        .footer {
            margin-top: 20px;
            background: #222;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Doctor Dashboard</h2>
        <ul>
            <li><a href="#">🏥 Dashboard</a></li>
            <li><a href="#">👨‍⚕️ View Patients</a></li>
            <li><a href="#">🧠 AI Diagnosis</a></li>
            <li><a href="#">📊 Reports</a></li>
            <li><a href="#">⚙️ Settings</a></li>
        </ul>
    </div>

    <div class="dashboard-container">
        <h1>AI Diagnosis Insights</h1>
        <div class="chart-container">
            <canvas id="diagnosisChart"></canvas>
        </div>
    </div>

    <div class="footer">
        <p>© 2024 Healthcare AI | All rights reserved</p>
    </div>

    <script>
        var ctx = document.getElementById('diagnosisChart').getContext('2d');
        var chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Hypothyroidism', 'Hyperthyroidism', 'Normal'],
                datasets: [{
                    label: 'Diagnosis Cases',
                    data: [50, 30, 20],
                    backgroundColor: ['#007bff', '#ff5733', '#28a745']
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
    </script>
</body>
</html>
